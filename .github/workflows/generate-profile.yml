name: Generate profile

on:
  push:
    branches: [main]
    paths:
      - profile/data.yaml
      - scripts/generate-profile.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/generate-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run generate

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: generate profile from data.yaml'
          file_pattern: profile/README.md profile/projects.json
